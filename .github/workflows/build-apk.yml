name: Build MAK2B Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MAK2B-App-v1.1.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Expo project
        run: |
          rm -rf project
          mkdir -p project

          unzip -o "MAK2B-App-v1.1.zip" -d project

          APP_DIR=$(dirname "$(find project -type f -name package.json | head -n 1)")

          if [ -z "$APP_DIR" ]; then
            echo "package.json not found"
            exit 1
          fi

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm install

      - name: Generate Android project
        working-directory: ${{ env.APP_DIR }}
        run: |
          npx expo prebuild --platform android --no-install

      - name: Build Android APK
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          
          - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MAK2B-Android-APK
        path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

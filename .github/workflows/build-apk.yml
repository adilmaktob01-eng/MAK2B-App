name: Build MAK2B Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MAK2B-App-v1.1.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare app files
        run: |
          rm -rf websrc www
          mkdir -p websrc www

          unzip -o "MAK2B-App-v1.1.zip" -d websrc

          INDEX_DIR=$(dirname "$(find websrc -type f -name index.html | head -n 1)")

          if [ -z "$INDEX_DIR" ]; then
            echo "index.html not found"
            exit 1
          fi

          cp -a "$INDEX_DIR"/. www/

      - name: Create Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7
          npm install -D @capacitor/cli@7

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.maktoub.mak2b",
            "appName": "MAK2B",
            "webDir": "www"
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAK2B-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
